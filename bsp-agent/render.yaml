# Render blueprint: one web service with a 1 GB persistent disk for the SQLite file.
# The disk needs a paid instance type (Starter); the free tier wipes files on redeploy.
services:
  - type: web
    name: bsp-enquiry-agent
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false            # set it in the Render dashboard; never committed
      - key: BSP_DB_PATH
        value: /var/data/app.db
      - key: PYTHON_VERSION
        value: 3.12.3
    disk:
      name: bsp-data
      mountPath: /var/data
      sizeGB: 1
